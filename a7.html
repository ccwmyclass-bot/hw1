<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹撞擊｜3D 打磚塊</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        :root{color-scheme:dark;--ink:#f7f8ff;--muted:#9eabc9;--cyan:#52f5e3;--pink:#ff4db8;--yellow:#ffe66d;--night:#080c20;--line:#38436b}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#25386a 0%,#10162e 40%,#080b19 100%);color:var(--ink);font-family:'Noto Sans TC',sans-serif;display:grid;place-items:center;padding:24px 16px;overflow-x:hidden}
        .wrap{width:min(100%,760px);animation:arrive .7s ease both}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ffdb62,#ff5d9e 52%,#a04dff);box-shadow:0 5px 0 #77376d,0 0 26px #ff559b77;font-size:23px}.eyebrow{font:700 10px Oxanium,sans-serif;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}.brand h1{font:800 clamp(20px,4vw,29px) 'Noto Sans TC',sans-serif;line-height:1.2;margin:2px 0 0}.actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:1px solid #66729b;border-radius:11px;color:var(--ink);background:#161d37;cursor:pointer;font-size:17px;box-shadow:0 4px 0 #090d1e;transition:transform .15s,border-color .15s}.icon-btn:hover{border-color:var(--cyan);transform:translateY(-2px)}.icon-btn:active{transform:translateY(2px);box-shadow:none}
        .scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.stat{min-width:0;padding:10px 13px 9px;background:linear-gradient(150deg,#1c2543,#12182e);border:1px solid #334064;border-radius:10px;box-shadow:0 4px 0 #080b18}.stat-label{font:700 10px Oxanium,sans-serif;letter-spacing:1.2px;color:var(--muted)}.stat-value{display:block;margin-top:3px;font:700 23px Oxanium,sans-serif;color:var(--yellow);font-variant-numeric:tabular-nums}.stat:nth-child(2) .stat-value{color:#ff72be}.stat:nth-child(3) .stat-value{color:var(--cyan)}.stat:nth-child(4) .stat-value{color:#b995ff}
        .cabinet{position:relative;padding:12px;border:1px solid #53638e;border-radius:17px;background:linear-gradient(135deg,#28365d,#11182f 36%,#090e20);box-shadow:0 16px 45px #02040d99,0 0 0 4px #111831,0 0 34px #5a63ff29;perspective:1000px}.board{position:relative;overflow:hidden;margin:auto;width:min(100%,560px);transform:rotateX(2deg);transform-origin:center top;border:2px solid #506188;border-radius:9px;background:#080d22;box-shadow:inset 0 0 45px #202f5c99,0 12px 0 #080b17,0 15px 26px #030510aa}.board::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#fff0 0 3px,#c5eeff08 4px);mix-blend-mode:screen}.board canvas{display:block;width:100%;height:auto;aspect-ratio:420/610;touch-action:none}.overlay{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:22px;background:#080c20d9;backdrop-filter:blur(7px)}.overlay[hidden]{display:none}.overlay h2{margin:0;color:var(--yellow);font:800 clamp(22px,5vw,34px) 'Noto Sans TC',sans-serif;text-shadow:0 0 20px #ff64b8aa}.overlay p{margin:0;color:#d3daed;line-height:1.8;font-size:14px}.play-btn{border:0;border-radius:8px;padding:12px 26px;color:#091023;background:linear-gradient(100deg,#ffe66d,#ff8ac4 60%,#c8a5ff);font:800 15px 'Noto Sans TC',sans-serif;cursor:pointer;box-shadow:0 5px 0 #8f4885,0 0 26px #ff75c34d;transition:transform .15s}.play-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.play-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f4885}.instructions{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:19px;color:var(--muted);font-size:12px}.instructions strong{color:#e9eefe;font-weight:500}.keys{font:600 11px Oxanium,sans-serif;color:var(--cyan)}
        @keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){body{padding:16px 12px}.topline{margin-bottom:13px}.brand{gap:9px}.mark{width:36px;border-radius:11px}.actions{gap:6px}.icon-btn{width:38px;height:38px}.scorebar{gap:6px}.stat{padding:8px 8px 7px}.stat-label{font-size:9px;letter-spacing:.7px}.stat-value{font-size:20px}.cabinet{padding:8px;border-radius:13px}.instructions{align-items:flex-start;flex-direction:column;gap:5px;margin:15px 2px 0}.overlay p{font-size:13px}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
    </style>
</head>
<body>
<main class="wrap">
    <header class="topline">
        <div class="brand"><div class="mark" aria-hidden="true">✦</div><div><div class="eyebrow">ARCADE · 3D BREAKOUT</div><h1>霓虹撞擊</h1></div></div>
        <div class="actions"><button class="icon-btn" id="soundBtn" type="button" aria-label="關閉音效" title="音效開關">♫</button><button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停遊戲" title="暫停（P）">Ⅱ</button></div>
    </header>
    <section class="scorebar" aria-label="遊戲資訊">
        <div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value" id="score">0000</strong></div>
        <div class="stat"><span class="stat-label">LIVES</span><strong class="stat-value" id="lives">3</strong></div>
        <div class="stat"><span class="stat-label">LEVEL</span><strong class="stat-value" id="level">1</strong></div>
        <div class="stat"><span class="stat-label">BEST</span><strong class="stat-value" id="best">0000</strong></div>
    </section>
    <section class="cabinet" aria-label="打磚塊遊戲場地">
        <div class="board"><canvas id="game" width="420" height="610" aria-label="霓虹打磚塊遊戲"></canvas>
            <div class="overlay" id="overlay"><h2 id="overlayTitle">準備好撞擊了嗎？</h2><p id="overlayMessage">打掉所有霓虹磚塊，挑戰更高關卡。<br>接住球，別讓它掉出場地！</p><button class="play-btn" id="startBtn" type="button">開始遊戲</button></div>
        </div>
    </section>
    <footer class="instructions"><span><strong>移動平台：</strong>滑鼠、觸控，或 <span class="keys">← → / A D</span></span><span><strong>暫停：</strong><span class="keys">P</span>　<strong>音效：</strong><span class="keys">M</span></span></footer>
</main>
<script>
(()=>{
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');
    const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),levelEl=document.querySelector('#level'),bestEl=document.querySelector('#best');
    const W=420,H=610,colors=['#ff568f','#ffad4d','#ffe66d','#51e5bd','#48c8ff','#bb8aff'];
    let score=0,lives=3,level=1,best=Number(localStorage.getItem('breakoutBest')||0),running=false,paused=false,lastTime=0,frame=0,audio=null,sound=true,pointerX=null;
    const keys={},bricks=[],particles=[];
    const paddle={x:W/2-48,y:H-43,w:96,h:13,speed:520};
    const ball={x:W/2,y:paddle.y-12,r:8,vx:190,vy:-300};
    bestEl.textContent=String(best).padStart(4,'0');
    function tone(freq,duration=.09,type='sine',volume=.055){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(error){}}
    function makeBricks(){bricks.length=0;const cols=8,rows=Math.min(5+Math.floor((level-1)/2),7),bw=43,bh=22,gap=7,left=(W-(cols*bw+(cols-1)*gap))/2;for(let row=0;row<rows;row++)for(let col=0;col<cols;col++)bricks.push({x:left+col*(bw+gap),y:75+row*(bh+9),w:bw,h:bh,color:colors[(row+level-1)%colors.length],alive:true,hp:level>2&&row<2?2:1});}
    function resetBall(){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;const direction=Math.random()<.5?-1:1;ball.vx=direction*(150+level*9);ball.vy=-(280+level*15);}
    function start(){score=0;lives=3;level=1;paddle.x=W/2-paddle.w/2;makeBricks();resetBall();scoreEl.textContent='0000';livesEl.textContent=lives;levelEl.textContent=level;overlay.hidden=true;running=true;paused=false;lastTime=performance.now();tone(560,.16,'triangle');requestAnimationFrame(loop)}
    function finish(won){running=false;paused=false;overlay.hidden=false;document.querySelector('#overlayTitle').textContent=won?'全場清空！':'遊戲結束';document.querySelector('#overlayMessage').innerHTML=`最終分數：${score}<br>${won?'太漂亮了，再來挑戰更高分！':'再試一次，這次一定能接住！'}`;document.querySelector('#startBtn').textContent='再玩一次';tone(won?760:110,.45,won?'sine':'sawtooth',.07)}
    function update(dt){if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=paddle.speed*dt;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=paddle.speed*dt;if(pointerX!==null)paddle.x+=(pointerX-paddle.w/2-paddle.x)*Math.min(1,dt*16);paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
        if(ball.x<ball.r+8){ball.x=ball.r+8;ball.vx=Math.abs(ball.vx);tone(320,.045)}if(ball.x>W-ball.r-8){ball.x=W-ball.r-8;ball.vx=-Math.abs(ball.vx);tone(320,.045)}if(ball.y<ball.r+12){ball.y=ball.r+12;ball.vy=Math.abs(ball.vy);tone(380,.045)}
        if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x-2&&ball.x<=paddle.x+paddle.w+2){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*350;ball.vy=-Math.sqrt(Math.max(225*225,ball.vx*ball.vx+ball.vy*ball.vy));ball.y=paddle.y-ball.r;tone(510,.07,'triangle')}
        for(const brick of bricks){if(!brick.alive||ball.x+ball.r<brick.x||ball.x-ball.r>brick.x+brick.w||ball.y+ball.r<brick.y||ball.y-ball.r>brick.y+brick.h)continue;const overlapX=Math.min(ball.x+ball.r-brick.x,brick.x+brick.w-(ball.x-ball.r)),overlapY=Math.min(ball.y+ball.r-brick.y,brick.y+brick.h-(ball.y-ball.r));if(overlapX<overlapY)ball.vx*=-1;else ball.vy*=-1;brick.hp--;if(brick.hp<=0){brick.alive=false;score+=10;scoreEl.textContent=String(score).padStart(4,'0');if(score>best){best=score;bestEl.textContent=String(best).padStart(4,'0');localStorage.setItem('breakoutBest',String(best))}burst(brick.x+brick.w/2,brick.y+brick.h/2,brick.color)}else tone(250,.06,'square');break}
        if(ball.y>H+ball.r){lives--;livesEl.textContent=lives;tone(125,.3,'sawtooth');if(lives<=0){finish(false);return}resetBall()}
        if(bricks.every(brick=>!brick.alive)){level++;levelEl.textContent=level;makeBricks();resetBall();tone(880,.24,'triangle')}
        for(let i=particles.length-1;i>=0;i--){const part=particles[i];part.x+=part.vx*dt;part.y+=part.vy*dt;part.life-=dt;if(part.life<=0)particles.splice(i,1)}
    }
    function burst(x,y,color){for(let i=0;i<9;i++){const angle=Math.random()*Math.PI*2,speed=45+Math.random()*140;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color,life:.3+Math.random()*.4,max:.7})}tone(330+Math.random()*420,.1,'triangle')}
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function drawBrick(brick){const depth=6;ctx.save();ctx.shadowColor=brick.color;ctx.shadowBlur=brick.hp>1?7:13;roundRect(brick.x+2,brick.y+depth,brick.w,brick.h,5);ctx.fillStyle=brick.color+'55';ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(brick.x+4,brick.y+2);ctx.lineTo(brick.x+brick.w-4,brick.y+2);ctx.lineTo(brick.x+brick.w-1,brick.y+depth+2);ctx.lineTo(brick.x+brick.w-6,brick.y+brick.h+depth);ctx.lineTo(brick.x+3,brick.y+brick.h+depth);ctx.lineTo(brick.x,brick.y+depth+5);ctx.closePath();const gradient=ctx.createLinearGradient(brick.x,brick.y,brick.x+brick.w,brick.y+brick.h);gradient.addColorStop(0,'#ffffff');gradient.addColorStop(.12,brick.color);gradient.addColorStop(1,brick.color);ctx.fillStyle=gradient;ctx.fill();ctx.strokeStyle='#ffffff99';ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=.5;ctx.fillStyle='#fff';roundRect(brick.x+6,brick.y+4,brick.w-14,2,2);ctx.fill();if(brick.hp>1){ctx.globalAlpha=.9;ctx.fillStyle='#fff';ctx.font='700 10px Oxanium';ctx.textAlign='right';ctx.fillText('2',brick.x+brick.w-5,brick.y+brick.h-4)}ctx.restore()}
    function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#111b3b');bg.addColorStop(.55,'#0b122b');bg.addColorStop(1,'#10122d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.strokeStyle='#62caff0b';ctx.lineWidth=1;for(let x=14;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();ctx.fillStyle='#d9e8ff55';for(let i=0;i<38;i++){const sx=(i*97+31)%W,sy=(i*151+frame*.14)%H;ctx.fillRect(sx,sy,1.5,1.5)}bricks.forEach(brick=>{if(brick.alive)drawBrick(brick)});
        for(const part of particles){ctx.globalAlpha=Math.max(0,part.life/part.max);ctx.fillStyle=part.color;ctx.shadowColor=part.color;ctx.shadowBlur=8;ctx.fillRect(part.x,part.y,4,4)}ctx.globalAlpha=1;ctx.shadowBlur=0;
        ctx.save();ctx.shadowColor='#41f7e1';ctx.shadowBlur=23;const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);pg.addColorStop(0,'#61c9ff');pg.addColorStop(.5,'#a3fff0');pg.addColorStop(1,'#c2a1ff');roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fillStyle=pg;ctx.fill();ctx.shadowBlur=0;roundRect(paddle.x+8,paddle.y+3,paddle.w-16,2,2);ctx.fillStyle='#ffffffcc';ctx.fill();ctx.restore();
        ctx.save();ctx.shadowColor='#ffe77a';ctx.shadowBlur=24;const ballGradient=ctx.createRadialGradient(ball.x-3,ball.y-4,1,ball.x,ball.y,ball.r+2);ballGradient.addColorStop(0,'#fff');ballGradient.addColorStop(.35,'#fff4a5');ballGradient.addColorStop(1,'#ff9c45');ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=ballGradient;ctx.fill();ctx.restore();frame++}
    function loop(now){if(!running)return;if(!paused){const dt=Math.min((now-lastTime)/1000,.035);lastTime=now;update(dt);draw()}if(running)requestAnimationFrame(loop)}
    function pause(){if(!running)return;paused=!paused;overlay.hidden=!paused;if(paused){document.querySelector('#overlayTitle').textContent='暫停中';document.querySelector('#overlayMessage').textContent='休息一下，準備好再繼續。';document.querySelector('#startBtn').textContent='繼續遊戲';document.querySelector('#pauseBtn').textContent='▶';document.querySelector('#pauseBtn').setAttribute('aria-label','繼續遊戲')}else{lastTime=performance.now();document.querySelector('#pauseBtn').textContent='Ⅱ';document.querySelector('#pauseBtn').setAttribute('aria-label','暫停遊戲');requestAnimationFrame(loop)}}
    function movePointer(event){const rect=canvas.getBoundingClientRect();pointerX=(event.clientX-rect.left)/rect.width*W}
    document.querySelector('#startBtn').addEventListener('click',()=>{if(paused){pause();return}start()});document.querySelector('#pauseBtn').addEventListener('click',pause);document.querySelector('#soundBtn').addEventListener('click',event=>{sound=!sound;event.currentTarget.textContent=sound?'♫':'♪';event.currentTarget.setAttribute('aria-label',sound?'關閉音效':'開啟音效');if(sound)tone(660,.08)});
    canvas.addEventListener('pointermove',movePointer);canvas.addEventListener('pointerleave',()=>{pointerX=null});canvas.addEventListener('pointerdown',movePointer);window.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();keys[event.key]=true;if(event.key.toLowerCase()==='p')pause();if(event.key.toLowerCase()==='m')document.querySelector('#soundBtn').click()});window.addEventListener('keyup',event=>{keys[event.key]=false});
    makeBricks();resetBall();draw();
})();
</script>
</body>
</html>
