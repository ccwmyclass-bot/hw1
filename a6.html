<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際守衛｜太空射擊</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#172b50,#050817 72%);color:#e8f6ff;font-family:system-ui,sans-serif}.game{width:min(94vw,520px);text-align:center}h1{margin:0 0 8px;color:#83eaff;letter-spacing:.18em;text-shadow:0 0 18px #28bfff}.hud{display:flex;justify-content:space-between;padding:9px 14px;color:#bcecff;font-weight:bold}.screen{position:relative;overflow:hidden;border:1px solid #4bcfff88;border-radius:12px;box-shadow:0 0 28px #087ec455}canvas{display:block;width:100%;height:min(68vh,620px);min-height:390px;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;gap:12px;padding:24px;background:#050b1bd9}.overlay.hidden{display:none}.overlay h2{margin:0;color:#8beaff;font-size:2rem}.overlay p{line-height:1.7}button{justify-self:center;padding:11px 28px;border:0;border-radius:999px;background:linear-gradient(90deg,#61e9ff,#8b9dff);font:inherit;font-weight:800;cursor:pointer}.help{color:#91a9c9;font-size:.88rem}
    </style>
</head>
<body>
<main class="game"><h1>星際守衛</h1><div class="hud"><span>分數：<b id="score">0</b></span><span>生命：<b id="lives">3</b></span><span>最高：<b id="best">0</b></span></div>
<div class="screen"><canvas id="game" aria-label="太空射擊遊戲"></canvas><div class="overlay" id="overlay"><h2 id="title">準備出擊！</h2><p id="message">擊落隕石，守護宇宙。<br>使用 ← → 或 A、D 移動，空白鍵射擊。<br>手機可拖曳戰機並自動射擊。</p><button id="start">開始遊戲</button></div></div><p class="help">音效由遊戲即時合成；按 M 可切換音效</p></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreText=document.querySelector('#score'),lifeText=document.querySelector('#lives');let w,h,run=false,score=0,lives=3,last=0,spawn=0,shot=0,audio,sound=true;const keys={},stars=[],shots=[],rocks=[],p={x:0,y:0,target:null,shield:0};document.querySelector('#best').textContent=localStorage.spaceBest||0;
function size(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);p.y=h-48;if(!p.x)p.x=w/2;stars.length=0;for(let i=0;i<75;i++)stars.push({x:Math.random()*w,y:Math.random()*h,s:20+Math.random()*90})}function beep(f,d,type='sine'){if(!sound)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function begin(){score=0;lives=3;shots.length=rocks.length=0;p.x=w/2;p.shield=1.4;scoreText.textContent=0;lifeText.textContent=3;overlay.classList.add('hidden');run=true;last=performance.now();beep(520,.15);requestAnimationFrame(loop)}function finish(){run=false;let best=Math.max(score,+localStorage.spaceBest||0);localStorage.spaceBest=best;document.querySelector('#best').textContent=best;document.querySelector('#title').textContent='任務結束';document.querySelector('#message').innerHTML=`最終分數：${score}<br>再接再厲，守護星際！`;document.querySelector('#start').textContent='再玩一次';overlay.classList.remove('hidden');beep(120,.5,'sawtooth')}
function update(dt){for(let s of stars){s.y+=s.s*dt;if(s.y>h){s.y=0;s.x=Math.random()*w}}if(keys.ArrowLeft||keys.a)p.x-=300*dt;if(keys.ArrowRight||keys.d)p.x+=300*dt;if(p.target!==null)p.x+=(p.target-p.x)*Math.min(1,dt*12);p.x=Math.max(18,Math.min(w-18,p.x));p.shield=Math.max(0,p.shield-dt);shot-=dt;if((keys[' ']||p.target!==null)&&shot<=0){shots.push({x:p.x,y:p.y-20});shot=.23;beep(740,.06,'square')}spawn-=dt;if(spawn<=0){rocks.push({x:20+Math.random()*(w-40),y:-25,r:13+Math.random()*9,v:75+Math.random()*70+score*.2,a:Math.random()*6});spawn=Math.max(.35,.9-score*.004)}shots.forEach(b=>b.y-=440*dt);rocks.forEach(r=>{r.y+=r.v*dt;r.a+=dt});for(let i=rocks.length-1;i>=0;i--){let r=rocks[i],bi=shots.findIndex(b=>Math.hypot(b.x-r.x,b.y-r.y)<r.r+4);if(bi>=0){shots.splice(bi,1);rocks.splice(i,1);score+=10;scoreText.textContent=score;beep(260,.12);continue}if(Math.hypot(p.x-r.x,p.y-r.y)<r.r+15&&p.shield<=0){rocks.splice(i,1);lifeText.textContent=--lives;p.shield=1.2;beep(100,.3,'sawtooth');if(lives<=0)finish()}else if(r.y>h+20)rocks.splice(i,1)}for(let i=shots.length-1;i>=0;i--)if(shots[i].y<0)shots.splice(i,1)}
function draw(){x.clearRect(0,0,w,h);x.fillStyle='#070d20';x.fillRect(0,0,w,h);x.fillStyle='#d7edff';for(let s of stars){x.globalAlpha=.5;x.fillRect(s.x,s.y,1.5,1.5)}x.globalAlpha=1;for(let b of shots){x.shadowColor='#59f6ff';x.shadowBlur=12;x.fillStyle='#baffff';x.fillRect(b.x-2,b.y-9,4,13)}x.shadowBlur=0;for(let r of rocks){x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();for(let j=0;j<8;j++){let a=j*Math.PI/4,q=r.r*(j%2?.78:1);x.lineTo(Math.cos(a)*q,Math.sin(a)*q)}x.closePath();x.fillStyle='#bb6b85';x.strokeStyle='#ffb0a9';x.fill();x.stroke();x.restore()}if(p.shield<=0||Math.floor(performance.now()/90)%2===0){x.save();x.translate(p.x,p.y);x.shadowColor='#4ceaff';x.shadowBlur=16;x.beginPath();x.moveTo(0,-21);x.lineTo(16,15);x.lineTo(0,9);x.lineTo(-16,15);x.closePath();x.fillStyle='#68dfff';x.fill();x.strokeStyle='white';x.stroke();x.restore()}}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='m')sound=!sound});window.addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointerdown',e=>{p.target=e.offsetX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(e.buttons)p.target=e.offsetX});c.addEventListener('pointerup',()=>p.target=null);document.querySelector('#start').onclick=begin;window.addEventListener('resize',size);size();draw()})();
</script>
</body>
</html>
